# Production stack: Postgres, Redis, the crawler, the quotes API, the real-time multiplayer WS
# service, and the frontend, all on one internal Docker network. The frontend is included here
# (unlike this file's earlier version) specifically so it can reach api by plain service-name
# DNS (http://api:8080) without api needing any public domain at all — see PRODUCTION.md's
# "Isolating api" section for why that requires all of them living in the same compose project.
#
# Usage:
#   1. Copy .env.example (repo root) to .env.prod and fill in real, randomly-generated secrets
#      — never reuse the dev placeholder values (postgres/postgres, redis) here.
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod logs -f
#
# Unlike backend/scraper/docker-compose.yml (local dev only, Postgres/Redis with host ports
# exposed for direct psql/redis-cli access), postgres, redis, and now api here are NOT exposed to
# the host at all — only reachable from other containers on this compose network, by service
# name (postgres/redis/api), not localhost. ws is still host-exposed for now (see its own
# comment below) — only frontend and ws need a real public domain in front of them.
#
# Every service below caps its own container logs (x-logging) — Docker's json-file driver has
# NO size limit by default, so a long-running background worker like the crawler (which logs
# roughly one line per URL discovered/fetched) will otherwise grow its log file unbounded until
# it fills the host's disk. 10m x 3 files = 30MB max per service, rotated automatically.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16
    container_name: quotes-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  crawler:
    build: ./backend/scraper
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      # Measured live, not guessed: with the memory limit removed entirely, the crawler's real
      # stable working set plateaus at ~1.25GB (language models restricted to Latin-script-only
      # already cut ~700MB off that — see internal/dedup/language.go). An earlier attempt set
      # both the hard limit and GOMEMLIMIT far below this real number (512M / 400MiB) — that
      # didn't fix anything, it just made the GC fight a losing battle to stay under a target
      # smaller than the live working set, burning CPU (seen live: 400-600%) while still
      # eventually hitting the hard limit and getting OOM-killed anyway. GOMEMLIMIT only helps
      # once it's set *above* what the process actually needs, so the GC has genuine slack to
      # collect proactively instead of constantly fighting an impossible target.
      GOMEMLIMIT: 1536MiB
      # Failures only — see .env.example and PRODUCTION.md's "Cap container log size" note.
      # Use "warn" instead to also keep skip/retry/fallback lines for debugging.
      LOG_LEVEL: error
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    build: ./backend/api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      API_PORT: 8080
      # No browser ever talks to api directly anymore (no ports: entry below at all) — only the
      # frontend service's own server does, over this compose network, via its own
      # API_INTERNAL_URL (see the frontend service). CORS_ALLOWED_ORIGIN is effectively
      # vestigial now (CORS is a browser-only mechanism, and no browser request ever reaches
      # this service), kept set only as harmless defense-in-depth in case a domain is ever
      # added back for debugging.
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      # Same reasoning as crawler's GOMEMLIMIT — this service is far lighter (no language
      # models loaded), but there's no reason to leave Go's GC unaware of the container limit.
      GOMEMLIMIT: 100MiB
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  ws:
    build: ./backend/ws
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WS_PORT: 8081
      # Same frontend origin as the api service — both are read by the one deployed frontend.
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      # Same reasoning as api's GOMEMLIMIT (no language models loaded, far lighter than the
      # crawler) — unlike that figure, this one isn't measured against real sustained load yet
      # (see PRODUCTION.md), just a conservative starting point matching api's own footprint.
      GOMEMLIMIT: 100MiB
    # Still bound to localhost + fronted by a reverse proxy (Caddy/nginx), unlike api above —
    # ws isn't proxied through the frontend's own server yet (that needs a WebSocket proxy,
    # a separate, more involved piece of work than api's plain HTTP one; see PRODUCTION.md).
    # Browsers still connect to this domain directly for now. See backend/ws/Caddyfile.example.
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8081/health']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Plain service-name DNS, only reachable because frontend and api are in this same
      # compose project — see this file's top comment. Not VITE_-prefixed on purpose: Vite only
      # inlines VITE_-prefixed vars into the client bundle, which would defeat the entire point
      # of keeping api off the public internet. This one's read fresh from process.env inside a
      # createServerFn handler (see frontend/src/lib/typing/sentences.ts), server-side only.
      API_INTERNAL_URL: http://api:8080
      # Still a real public wss:// URL for now, same as CORS_ALLOWED_ORIGIN above — ws isn't
      # proxied through the frontend yet (see ws's own comment). This one IS VITE_-prefixed and
      # DOES need the build-time-placeholder/runtime-substitution dance in
      # frontend/Dockerfile + frontend/docker-entrypoint.sh, since the browser connects to it
      # directly.
      VITE_WS_URL: ${VITE_WS_URL}
    # Bound to localhost only, fronted by a reverse proxy — same pattern as ws above. See
    # frontend/Caddyfile.example.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
